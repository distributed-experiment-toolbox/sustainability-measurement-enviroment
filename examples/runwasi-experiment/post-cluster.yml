---
# Baseline post-cluster, then re-apply what Kubespray overwrote and register
# the RuntimeClass.
#
#   ansible-playbook -i hosts.yml post-cluster.yml

- import_playbook: sustian.deploy.post_cluster

- name: "Re-apply runwasi shim config (Kubespray rewrites containerd)"
  hosts: sut
  become: true
  tags: [runwasi]
  roles:
    - runwasi_shim

- name: "Register the wasmtime RuntimeClass"
  hosts: control_plane
  become: false
  tasks:
    - name: Apply wasmtime RuntimeClass
      shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: node.k8s.io/v1
        kind: RuntimeClass
        metadata:
          name: wasmtime
        handler: wasmtime
        scheduling:
          nodeSelector:
            role: sut
        EOF
      changed_when: false

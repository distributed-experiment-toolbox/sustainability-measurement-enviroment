---
# Install process-exporter as a systemd service on SUT nodes.
# Uses the configuration from deploy/configurations/process-exporter.yml.

- name: Download process-exporter {{ process_exporter_version }}
  get_url:
    url: "https://github.com/ncabatoff/process-exporter/releases/download/v{{ process_exporter_version }}/process-exporter-{{ process_exporter_version }}.linux-{{ deploy_arch }}.tar.gz"
    dest: "/tmp/process-exporter-{{ process_exporter_version }}.tar.gz"

- name: Extract process-exporter
  unarchive:
    src: "/tmp/process-exporter-{{ process_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true

- name: Install process-exporter binary
  copy:
    src: "/tmp/process-exporter-{{ process_exporter_version }}.linux-{{ deploy_arch }}/process-exporter"
    dest: /usr/local/bin/process-exporter
    mode: "0755"
    remote_src: true
  notify: restart process-exporter

# The exporter reads this file once, at startup. Without the notify a config
# change lands on disk and the running process keeps serving the old groups,
# which is silent: the scrape target stays up and Prometheus keeps receiving
# the metrics the previous config defined. A campaign then measures with an
# instrument it believes it has changed.
- name: Deploy process-exporter configuration
  copy:
    src: "{{ process_exporter_config_file }}"
    dest: /etc/process-exporter.yml
  notify: restart process-exporter

- name: Create process-exporter systemd service
  template:
    src: process-exporter.service.j2
    dest: /etc/systemd/system/process-exporter.service
  notify: restart process-exporter

- name: Enable and start process-exporter
  systemd:
    name: process-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Create temporary scrape config for Prometheus
  template:
    src: scrape-config.j2
    dest: /tmp/scrape-config.yaml
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true

- name: Update Prometheus configuration to scrape process-exporter
  command: kubectl apply -n monitoring -f /tmp/scrape-config.yaml
  args:
    chdir: /tmp
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  become: false
  
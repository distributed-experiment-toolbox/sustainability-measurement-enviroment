---
# Ensure RAPL (Running Average Power Limit) is accessible on SUT nodes.
# Required for energy measurement tools (kepler, scaphandre).
#
# Works on both Intel (intel-rapl powercap) and AMD Zen2+ (rapl_msr /
# amd_rapl via the same /sys/class/powercap/intel-rapl* interface on
# kernel 5.11+). On older AMD kernels the amd_energy hwmon driver is
# loaded as fallback; modprobe failure is non-fatal on Intel hosts.

- name: Detect CPU vendor
  shell: "awk -F': ' '/vendor_id/ {print $2; exit}' /proc/cpuinfo"
  register: cpu_vendor
  changed_when: false

- name: Load msr kernel module
  modprobe:
    name: msr
    state: present

- name: Load amd_energy kernel module (AMD only, fallback for older kernels)
  modprobe:
    name: amd_energy
    state: present
  when: "'AuthenticAMD' in cpu_vendor.stdout"
  failed_when: false

- name: Persist msr module across reboots
  copy:
    content: |
      msr
      {% if 'AuthenticAMD' in cpu_vendor.stdout %}amd_energy
      {% endif %}
    dest: /etc/modules-load.d/rapl.conf

- name: Set msr device permissions (read access for all)
  shell: chmod a+r /dev/cpu/*/msr
  changed_when: false
  failed_when: false

- name: Install RAPL-related packages
  apt:
    name:
      - linux-cpupower
      - msr-tools
    state: present

# --- perf event access for node-exporter --collector.perf ---
# Default kernel.perf_event_paranoid on Debian is 4 (most restrictive).
# 0 allows raw tracepoints + per-cpu measurements from CAP_PERFMON
# containers (node-exporter on the SUT). Drop further to -1 only if
# you need kernel-side profiling from unprivileged users.

- name: Allow perf event access for measurement containers
  sysctl:
    name: kernel.perf_event_paranoid
    value: "0"
    sysctl_file: /etc/sysctl.d/99-perf.conf
    state: present
    reload: true

- name: Allow kptr access for perf symbolisation
  sysctl:
    name: kernel.kptr_restrict
    value: "0"
    sysctl_file: /etc/sysctl.d/99-perf.conf
    state: present
    reload: true

- name: Verify RAPL availability
  shell: ls /sys/class/powercap/intel-rapl*/
  register: rapl_check
  changed_when: false
  failed_when: false

- name: Warn if RAPL not available
  debug:
    msg: >-
      RAPL powercap interface not found. Intel: ensure CONFIG_INTEL_RAPL
      enabled. AMD: requires Zen2+ (Ryzen 3000+/EPYC 7002+) and kernel
      5.11+ for rapl_msr powercap, or amd_energy hwmon on older kernels.
      Energy measurements may not work.
  when: rapl_check.rc != 0

---
# Post-cluster setup: run AFTER Kubespray completes.
# Usage:
#   ansible-playbook -i inventory/hosts.yml post-cluster.yml

- name: "Step 5a - Fix CoreDNS loop (systemd-resolved on Debian 13)"
  hosts: control_plane
  become: false
  tasks:
    - name: Get current CoreDNS ConfigMap
      command: kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}'
      register: coredns_corefile
      changed_when: false

    - name: Patch CoreDNS ConfigMap to use upstream DNS instead of /etc/resolv.conf
      shell: |
        kubectl -n kube-system get configmap coredns -o json | \
        sed 's|forward \. /etc/resolv\.conf|forward . 8.8.8.8 8.8.4.4|g' | \
        kubectl apply -f -
      when: "'forward . /etc/resolv.conf' in coredns_corefile.stdout"
      register: coredns_patch

    - name: Restart CoreDNS deployment
      command: kubectl -n kube-system rollout restart deployment coredns
      when: coredns_patch is changed

- name: "Step 5b - Re-install Docker tooling on control-plane (Kubespray may remove it)"
  hosts: control_plane
  become: true
  tasks:
    - name: Ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker packages without recommends
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
        install_recommends: false

    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Add control-plane user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: true
        state: started

- name: "Step 6 - Label Kubernetes nodes"
  hosts: control_plane
  become: false
  roles:
    - node_labels

- name: "Step 7a - Install observability stack (Helm charts)"
  hosts: control_plane
  become: false
  roles:
    - observability

- name: "Step 7b - Install process-exporter on SUT nodes"
  hosts: sut
  become: true
  roles:
    - process_exporter

- name: "Step 8 - Generate ssh config on control-plane for SUT access"
  hosts: control_plane
  become: false
  roles:
    - generate_ssh_config

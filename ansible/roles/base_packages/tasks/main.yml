---
# Install required packages on all nodes.
# Control-plane gets additional development tools.

- name: Resolve user home directory
  set_fact:
    user_home: "/home/{{ ansible_user }}"
  when: ansible_user != 'root'

- name: Resolve root home directory
  set_fact:
    user_home: "/root"
  when: ansible_user == 'root'

- name: Recover interrupted dpkg state
  command: dpkg --configure -a
  register: dpkg_recover
  changed_when: false
  failed_when: false

- name: Fix broken apt dependencies
  command: apt-get -f install -y
  register: apt_fix
  changed_when: false
  failed_when: false

- name: Update apt cache and upgrade
  command: apt update
  become: true
  
- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - ca-certificates
      - gnupg
      - lsb-release
      - apt-transport-https
      - jq
      - unzip
      - socat
      - conntrack
      - ipset
      - iptables
    state: present

# --- Control-plane only ---

- name: Install control-plane packages
  apt:
    name:
      - git
      - python3
      - python3-pip
      - python3-venv
      - pipenv
      - tmux
      - build-essential
      - pkg-config
      - libssl-dev
    state: present
  when: inventory_hostname in groups['control_plane']

- name: Install Helm (control-plane)
  shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  when: inventory_hostname in groups['control_plane']

- name: Install Skaffold (control-plane)
  get_url:
    url: https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
    dest: /usr/local/bin/skaffold
    mode: "0755"
  when: inventory_hostname in groups['control_plane']

# --- Docker on control-plane (for image building) ---

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['control_plane']

- name: Add Docker GPG key (control-plane)
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: inventory_hostname in groups['control_plane']

- name: Add Docker apt repository (control-plane)
  apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: inventory_hostname in groups['control_plane']

- name: Install Docker (control-plane)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    install_recommends: false
  when: inventory_hostname in groups['control_plane']

- name: Add configuration to docker for containerd socket (control-plane)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "containerd": "/run/containerd/containerd.sock"
      }
    mode: "0644"
  when: inventory_hostname in groups['control_plane']

- name: Enable and start Docker service (control-plane)
  systemd:
    name: docker
    enabled: true
    state: started
  when: inventory_hostname in groups['control_plane']

- name: Add user to docker group (control-plane)
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: inventory_hostname in groups['control_plane']

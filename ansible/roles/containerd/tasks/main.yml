---
# Install containerd v2, runc, and CNI plugins from official releases.
# Configure containerd with SystemdCgroup and config.d imports.
#
# NOTE: Kubespray v2.30.0 also installs containerd 2.2.1. Pre-installing here
# ensures containerd is available before the cluster is created. Kubespray may
# reconfigure containerd; the post-cluster playbook re-applies custom config.

- name: Load required kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/containerd.conf

- name: Set required sysctl parameters
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
    reload: true
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward", value: "1" }

# --- containerd ---

- name: Download containerd {{ containerd_version }}
  get_url:
    url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
    dest: "/tmp/containerd-{{ containerd_version }}.tar.gz"

- name: Extract containerd to /usr/local
  unarchive:
    src: "/tmp/containerd-{{ containerd_version }}.tar.gz"
    dest: /usr/local
    remote_src: true

- name: Install containerd systemd service
  get_url:
    url: "https://raw.githubusercontent.com/containerd/containerd/v{{ containerd_version }}/containerd.service"
    dest: /etc/systemd/system/containerd.service

# --- runc ---

- name: Download runc {{ runc_version }}
  get_url:
    url: "https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.amd64"
    dest: /usr/local/sbin/runc
    mode: "0755"

# --- CNI plugins ---

- name: Create CNI plugin directory
  file:
    path: /opt/cni/bin
    state: directory

- name: Download CNI plugins {{ cni_plugins_version }}
  get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-amd64-v{{ cni_plugins_version }}.tgz"
    dest: "/tmp/cni-plugins-{{ cni_plugins_version }}.tgz"

- name: Extract CNI plugins
  unarchive:
    src: "/tmp/cni-plugins-{{ cni_plugins_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: true

# --- containerd configuration ---

- name: Create containerd config directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /etc/containerd
    - /etc/containerd/config.d

- name: Generate default containerd config
  shell: /usr/local/bin/containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup in containerd config
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: Add config.d imports to containerd config
  replace:
    path: /etc/containerd/config.toml
    regexp: '^imports\s*=\s*\[.*\]'
    replace: 'imports = ["/etc/containerd/config.d/*.toml"]'
  notify: restart containerd

- name: Ensure imports line exists if missing
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^imports\s*='
    line: 'imports = ["/etc/containerd/config.d/*.toml"]'
    insertafter: '^version'
  notify: restart containerd

- name: Enable and start containerd
  systemd:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true

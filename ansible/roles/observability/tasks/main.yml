---
# Install observability stack via Helm.
# Uses value files from deploy/configurations/.
#
# NOTE: The existing configuration files in configurations/ are used as-is.
# Review them for any TODO items before running.

- name: Create temporary directory for Helm values
  file:
    path: /tmp/helm-values
    state: directory

- name: Copy Helm value files to control-plane
  copy:
    src: "{{ item }}"
    dest: "/tmp/helm-values/{{ item | basename }}"
  loop:
    - "{{ configurations_dir }}/kube-prometheus-stack.yaml"
    - "{{ configurations_dir }}/kepler.yaml"
    - "{{ configurations_dir }}/scaphandre.yaml"

# --- Helm repositories ---

- name: Add prometheus-community Helm repo
  command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  changed_when: false
  failed_when: false

- name: Update Helm repos
  command: helm repo update
  changed_when: false

# --- Clone scaphandre for its Helm chart (not available as a repo) ---

- name: Clone scaphandre repository
  git:
    repo: https://github.com/hubblo-org/scaphandre.git
    dest: /opt/scaphandre
    version: "v{{ scaphandre_chart_version }}"
  become: true

- name: Set ownership of scaphandre directory
  file:
    path: /opt/scaphandre
    owner: "{{ ansible_user }}"
    recurse: true
  become: true

# --- Install charts ---

- name: Create monitoring namespace
  command: kubectl create namespace monitoring
  changed_when: false
  failed_when: false

- name: Install kube-prometheus-stack
  command: >-
    helm upgrade --install kube-prometheus-stack
    prometheus-community/kube-prometheus-stack
    --namespace monitoring
    --version {{ kube_prometheus_stack_chart_version }}
    --values /tmp/helm-values/kube-prometheus-stack.yaml
    --wait --timeout 10m

- name: Render metrics-server ServiceMonitor manifest
  template:
    src: metrics-server-servicemonitor.yaml.j2
    dest: /tmp/helm-values/metrics-server-servicemonitor.yaml

- name: Apply metrics-server ServiceMonitor
  command: kubectl apply -f /tmp/helm-values/metrics-server-servicemonitor.yaml

- name: Install kepler
  command: >-
    helm upgrade --install kepler
    oci://quay.io/sustainable_computing_io/charts/kepler
    --namespace monitoring
    --version {{ kepler_chart_version }}
    --values /tmp/helm-values/kepler.yaml
    --wait --timeout 5m
  failed_when: false

# ignore failures
- name: Install scaphandre
  command: >-
    helm upgrade --install scaphandre /opt/scaphandre/helm/scaphandre
    --namespace monitoring
    --values /tmp/helm-values/scaphandre.yaml
    --wait --timeout 5m
  failed_when: false
  

- name: Patch scaphandre DaemonSet for permissions and nodeSelector
  shell: |
    kubectl -n monitoring patch daemonset scaphandre --type strategic --patch "$(cat <<'EOF'
    {{ lookup('template', 'scaphandre.ds.patch.j2') }}
    EOF
    )"

- name: Patch scaphandre ServiceMonitor with intervals and protocol
  shell: |
    kubectl -n monitoring patch servicemonitor scaphandre-service-monitoring --type merge --patch "$(cat <<'EOF'
    {{ lookup('template', 'scaphandre.sm.patch.j2') }}
    EOF
    )"

- name: Verify observability pods
  command: kubectl get pods -n monitoring
  register: monitoring_pods
  changed_when: false

- name: Show monitoring pods
  debug:
    msg: "{{ monitoring_pods.stdout_lines }}"

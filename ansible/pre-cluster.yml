---
# Pre-cluster setup: run BEFORE Kubespray.
# Usage:
#   ansible-playbook -i inventory/hosts.yml pre-cluster.yml

- name: "Step 1 - Configure SSH access from control-plane to SUT nodes"
  hosts: control_plane
  become: false
  roles:
    - ssh_access

- name: "Step 2a - Install base packages on all nodes"
  hosts: all
  become: true
  roles:
    - base_packages

- name: "Step 2b - Install and configure containerd on all nodes"
  hosts: all
  become: true
  roles:
    - containerd

- name: "Step 2c - Configure RAPL access on SUT nodes"
  hosts: sut
  become: true
  roles:
    - rapl

- name: "Step 2d - Pin SUT CPUs for stable power measurement"
  hosts: sut
  become: true
  roles:
    - cpu_perf

- name: "Step 3 - Prepare Kubespray"
  hosts: control_plane
  become: false
  roles:
    - kubespray
